name: Build Desktop App

on:
  push:
    branches: [custom-build]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "TRAKT_CLIENT_ID=b63065734283312676aca5abef66d3b4c60e49d3fb9f7d90c67519fc180bc50c" >> local.properties
          echo "TRAKT_CLIENT_SECRET=788792ac0548901aa63fd2273f4e7b57bde4d688122c37f693c0ac9cc0f6c768" >> local.properties
          echo "TRAKT_REDIRECT_URI=urn:ietf:wg:oauth:2.0:oob" >> local.properties

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libmpv-dev clang \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build nuvio-player (MPV wrapper)
        run: |
          cd nuvio-player
          npm install
          cd src-tauri
          cargo build --release
          cd ..
          mkdir -p ../composeApp/resources/linux
          cp src-tauri/target/release/nuvio-player ../composeApp/resources/linux/nuvio-player
          chmod +x ../composeApp/resources/linux/nuvio-player

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Build Desktop UberJar
        run: ./gradlew :composeApp:packageUberJarForCurrentOS

      - name: Build Desktop AppImage
        run: ./gradlew :composeApp:packageAppImage
        continue-on-error: true

      - name: Bundle nuvio-player into AppImage
        continue-on-error: true
        run: |
          echo "Looking for AppImage directory..."
          find composeApp/build/compose/binaries -type d 2>/dev/null | head -20
          echo "---"
          echo "Looking for nuvio-player binary..."
          find . -name "nuvio-player" -type f 2>/dev/null | head -5
          echo "---"
          APP_DIR=$(find composeApp/build/compose/binaries -maxdepth 4 -name "Nuvio" -type d 2>/dev/null | head -1)
          PLAYER=$(find . -name "nuvio-player" -not -path "*/src/*" -not -path "*/node_modules/*" -type f 2>/dev/null | head -1)
          if [ -n "$APP_DIR" ] && [ -n "$PLAYER" ]; then
            for dest in "$APP_DIR/lib/app" "$APP_DIR/bin" "$APP_DIR"; do
              mkdir -p "$dest" 2>/dev/null
              cp "$PLAYER" "$dest/nuvio-player" && chmod +x "$dest/nuvio-player" && echo "Copied to $dest" || true
            done
          else
            echo "AppImage dir: '$APP_DIR', Player: '$PLAYER' — skipping bundle"
          fi

      - name: Upload UberJar
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-desktop-linux-jar
          path: composeApp/build/compose/jars/*.jar

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nuvio-desktop-linux-appimage
          path: composeApp/build/compose/binaries/main/app/
