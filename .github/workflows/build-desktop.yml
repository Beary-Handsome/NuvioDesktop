name: Build Desktop App

on:
  push:
    branches: [custom-build]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "TRAKT_CLIENT_ID=b63065734283312676aca5abef66d3b4c60e49d3fb9f7d90c67519fc180bc50c" >> local.properties
          echo "TRAKT_CLIENT_SECRET=788792ac0548901aa63fd2273f4e7b57bde4d688122c37f693c0ac9cc0f6c768" >> local.properties
          echo "TRAKT_REDIRECT_URI=urn:ietf:wg:oauth:2.0:oob" >> local.properties

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config clang \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libglib2.0-dev \
            libpulse-dev libasound2-dev libpipewire-0.3-dev \
            libass-dev libplacebo-dev libegl-dev libgl-dev libx11-dev \
            libxrandr-dev libxss-dev libxext-dev libxpresent-dev \
            libvulkan-dev meson python3-jinja2 nasm
          # Remove system FFmpeg/libmpv-dev to force cmake to use bundled versions
          sudo apt-get remove -y libmpv-dev libmpv2 libavcodec-dev libavformat-dev libswscale-dev libavutil-dev libavfilter-dev libswresample-dev 2>/dev/null || true

      - name: Symlink bundled FFmpeg/libmpv for linker
        run: |
          BUNDLED=${{ github.workspace }}/mediamp/mediamp-mpv/libmpv/lib/linux/x86_64
          SYSLIB=/usr/lib/x86_64-linux-gnu

          # Copy real (non-symlink) versioned .so files into system path
          find "$BUNDLED" -maxdepth 1 -name "*.so*" -not -type l -type f | while read -r lib; do
            sudo cp "$lib" "$SYSLIB/" && echo "copied $(basename $lib)"
          done

          # Create soname symlinks the linker needs
          cd "$SYSLIB"
          for real in libavcodec.so.62.36.101 libavformat.so.62.19.101 libavutil.so.60.32.100 \
                      libswscale.so.9.8.100 libswresample.so.6.4.100 libavfilter.so.11.17.100; do
            if [ -f "$real" ]; then
              base="${real%.*.*}"
              short=$(echo "$real" | sed 's/\(lib[^.]*\.so\).*/\1/')
              sudo ln -sf "$real" "$base"
              sudo ln -sf "$real" "$short"
            fi
          done
          [ -f libmpv.so.2.5.0 ] && sudo ln -sf libmpv.so.2.5.0 libmpv.so.2 && sudo ln -sf libmpv.so.2.5.0 libmpv.so
          [ -f libplacebo.so.360 ] && sudo ln -sf libplacebo.so.360 libplacebo.so
          cd -

          sudo ldconfig 2>/dev/null || true

      - name: Build libmpv with audio support
        run: |
          set -e
          BUNDLED=${{ github.workspace }}/mediamp/mediamp-mpv/libmpv/lib/linux/x86_64
          SYSLIB=/usr/lib/x86_64-linux-gnu

          # --- 1. Install FFmpeg 7.1 headers from source ---
          git clone --depth 1 --branch n7.1 https://github.com/FFmpeg/FFmpeg.git /tmp/ffmpeg-src
          cd /tmp/ffmpeg-src
          # Configure just enough to generate headers (no compilation needed)
          ./configure --prefix=/tmp/ffmpeg-install \
            --disable-programs --disable-doc --disable-everything \
            --disable-autodetect --disable-static --enable-shared
          make install-headers
          FFMPEG_INCDIR=/tmp/ffmpeg-install/include
          echo "FFmpeg headers installed to $FFMPEG_INCDIR"
          ls "$FFMPEG_INCDIR"
          cd -

          # --- 2. Generate pkg-config .pc files for bundled FFmpeg ---
          PC_DIR=/tmp/ffmpeg-pc
          mkdir -p "$PC_DIR"
          for spec in libavcodec:62.36.101 libavformat:62.19.101 libavutil:60.32.100 libswscale:9.8.100 libswresample:6.4.100 libavfilter:11.17.100; do
            name="${spec%%:*}"
            ver="${spec##*:}"
            shortname="${name#lib}"
            printf 'prefix=/usr\nlibdir=%s\nincludedir=%s\n\nName: %s\nDescription: FFmpeg %s\nVersion: %s\nLibs: -L%s -l%s\nCflags: -I%s\n' \
              "$SYSLIB" "$FFMPEG_INCDIR" "$name" "$shortname" "$ver" "$SYSLIB" "$shortname" "$FFMPEG_INCDIR" \
              > "$PC_DIR/$name.pc"
          done
          # libplacebo (bundled, system headers from apt)
          printf 'prefix=/usr\nlibdir=%s\nincludedir=/usr/include\n\nName: libplacebo\nDescription: libplacebo\nVersion: 7.349.0\nLibs: -L%s -lplacebo\nCflags: -I/usr/include\n' \
            "$SYSLIB" "$SYSLIB" > "$PC_DIR/libplacebo.pc"
          echo "Generated pkg-config files:"
          ls "$PC_DIR"

          # --- 3. Build mpv from source with audio ---
          git clone --depth 1 --branch v0.39.0 https://github.com/mpv-player/mpv.git /tmp/mpv-src
          cd /tmp/mpv-src
          export PKG_CONFIG_PATH="$PC_DIR:/usr/lib/x86_64-linux-gnu/pkgconfig:$PKG_CONFIG_PATH"
          meson setup build \
            --prefix=/usr \
            -Dc_link_args="-Wl,-rpath,\$ORIGIN" \
            -Dlibmpv=true \
            -Dcplayer=false \
            -Dpulse=enabled \
            -Dalsa=enabled \
            -Dpipewire=enabled \
            -Dgl=enabled \
            -Degl=enabled \
            -Dx11=enabled \
            -Dvulkan=disabled \
            -Dwayland=disabled \
            -Dlua=disabled \
            -Djavascript=disabled \
            -Djpeg=disabled \
            -Dlibarchive=disabled \
            -Dlibbluray=disabled \
            -Ddvdnav=disabled \
            -Dcdda=disabled \
            -Drubberband=disabled \
            -Dsdl2=disabled \
            -Dmanpage-build=disabled \
            -Dhtml-build=disabled
          ninja -C build -j$(nproc)

          # --- 4. Replace bundled libmpv ---
          BUILT=$(find build -name "libmpv.so*" -not -type l -type f | head -1)
          echo "Built libmpv: $BUILT ($(stat -c%s "$BUILT") bytes)"
          strings "$BUILT" | grep -i "ao_pulse\|ao_pipewire\|ao_alsa" | head -5
          cp "$BUILT" "$BUNDLED/libmpv.so.2.5.0"
          cp "$BUILT" "$BUNDLED/libmpv.so"
          sudo cp "$BUILT" "$SYSLIB/libmpv.so.2.5.0"
          sudo ln -sf libmpv.so.2.5.0 "$SYSLIB/libmpv.so.2"
          sudo ln -sf libmpv.so.2.5.0 "$SYSLIB/libmpv.so"
          sudo ldconfig
          echo "Replaced bundled libmpv with audio-enabled build"
          cd -

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build nuvio-player (MPV wrapper)
        run: |
          cd nuvio-player
          npm install
          cd src-tauri
          cargo build --release
          cd ..
          mkdir -p ../composeApp/resources/linux
          cp src-tauri/target/release/nuvio-player ../composeApp/resources/linux/nuvio-player
          chmod +x ../composeApp/resources/linux/nuvio-player

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Build Desktop UberJar
        run: ./gradlew :composeApp:packageUberJarForCurrentOS

      - name: Build Desktop AppImage
        run: ./gradlew :composeApp:packageAppImage
        continue-on-error: true

      - name: Patch Nuvio.cfg java.library.path for portable install
        continue-on-error: true
        run: |
          CFG=$(find composeApp/build/compose/binaries -name "Nuvio.cfg" 2>/dev/null | head -1)
          echo "Nuvio.cfg: $CFG"
          if [ -n "$CFG" ]; then
            # Replace the CI runner's java.library.path with $APPDIR/native
            sed -i 's|java-options=-Djava.library.path=.*|java-options=-Djava.library.path=$APPDIR/native|' "$CFG"
            # Remove hardcoded OPENGL — Skiko auto-detects the right renderer
            sed -i '/skiko.renderApi=OPENGL/d' "$CFG"
            echo "Patched Nuvio.cfg:"
            grep -E "java.library.path|skiko" "$CFG" || true
          fi

      - name: Create Linux launcher wrapper (XWayland + OpenGL)
        continue-on-error: true
        run: |
          APP_DIR=$(find composeApp/build/compose/binaries -maxdepth 4 -name "Nuvio" -type d 2>/dev/null | head -1)
          if [ -n "$APP_DIR" ]; then
            mv "$APP_DIR/bin/Nuvio" "$APP_DIR/bin/Nuvio.real"
            cp "$APP_DIR/lib/app/Nuvio.cfg" "$APP_DIR/lib/app/Nuvio.real.cfg"
            printf '#!/bin/bash\nexport GDK_BACKEND=x11\nexport _JAVA_AWT_WM_NONREPARENTING=1\nDIR="$(cd "$(dirname "$0")" && pwd)"\nexec "$DIR/Nuvio.real" "$@"\n' > "$APP_DIR/bin/Nuvio"
            chmod +x "$APP_DIR/bin/Nuvio"
            echo "Created Nuvio launcher wrapper"
          fi

      - name: Bundle native binaries into AppImage
        continue-on-error: true
        run: |
          APP_DIR=$(find composeApp/build/compose/binaries -maxdepth 4 -name "Nuvio" -type d 2>/dev/null | head -1)
          echo "AppImage dir: $APP_DIR"

          # Bundle nuvio-player
          PLAYER=$(find . -name "nuvio-player" -not -path "*/src/*" -not -path "*/node_modules/*" -type f 2>/dev/null | head -1)
          if [ -n "$APP_DIR" ] && [ -n "$PLAYER" ]; then
            for dest in "$APP_DIR/lib/app" "$APP_DIR/bin" "$APP_DIR"; do
              mkdir -p "$dest"
              cp "$PLAYER" "$dest/nuvio-player" && chmod +x "$dest/nuvio-player" && echo "nuvio-player -> $dest" || true
            done
          fi

          # Bundle libmediampv.so (MPV JNI bridge)
          MEDIAMPV=$(find . -name "libmediampv.so" -not -path "*/src/*" -type f 2>/dev/null | head -1)
          echo "libmediampv.so: $MEDIAMPV"
          if [ -n "$APP_DIR" ] && [ -n "$MEDIAMPV" ]; then
            NATIVE_DIR="$APP_DIR/lib/app/native"
            mkdir -p "$NATIVE_DIR"
            cp "$MEDIAMPV" "$NATIVE_DIR/libmediampv.so" && echo "libmediampv.so -> $NATIVE_DIR"

            # Bundle the FFmpeg/libmpv libs that libmediampv.so links against
            # Copy REAL files only (fully-versioned), then create proper symlinks
            BUNDLED_LIBS="mediamp/mediamp-mpv/libmpv/lib/linux/x86_64"
            if [ -d "$BUNDLED_LIBS" ]; then
              # Copy real (non-symlink) .so files
              find "$BUNDLED_LIBS" -maxdepth 1 -name "*.so*" -not -type l -type f | while read -r lib; do
                cp "$lib" "$NATIVE_DIR/" && echo "  $(basename $lib) -> $NATIVE_DIR"
              done

              # Create proper soname symlinks in native dir
              cd "$NATIVE_DIR"
              for real in libavcodec.so.62.36.101 libavformat.so.62.19.101 libavutil.so.60.32.100 \
                          libswscale.so.9.8.100 libswresample.so.6.4.100 libavfilter.so.11.17.100; do
                if [ -f "$real" ]; then
                  base="${real%.*.*}"        # e.g. libavcodec.so.62
                  short="${base%.*}"         # e.g. libavcodec.so  (strip minor)
                  # But short for libavcodec.so.62 -> strip .62 -> libavcodec.so
                  short=$(echo "$real" | sed 's/\(lib[^.]*\.so\).*/\1/')
                  ln -sf "$real" "$base" && echo "  symlink $base -> $real"
                  ln -sf "$real" "$short" && echo "  symlink $short -> $real"
                fi
              done
              # libmpv: real file is libmpv.so.2.5.0
              if [ -f "libmpv.so.2.5.0" ]; then
                ln -sf libmpv.so.2.5.0 libmpv.so.2
                ln -sf libmpv.so.2.5.0 libmpv.so
                echo "  symlink libmpv.so.2 -> libmpv.so.2.5.0"
                echo "  symlink libmpv.so -> libmpv.so.2.5.0"
              fi
              # libplacebo: real file is libplacebo.so.360
              if [ -f "libplacebo.so.360" ]; then
                ln -sf libplacebo.so.360 libplacebo.so
                echo "  symlink libplacebo.so -> libplacebo.so.360"
              fi
              cd -
            fi
          fi

          echo "=== Final native files ==="
          find "$APP_DIR" \( -name "nuvio-player" -o -name "libmediampv*" -o -name "*.so*" \) 2>/dev/null

      - name: Upload UberJar
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-desktop-linux-jar
          path: composeApp/build/compose/jars/*.jar

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nuvio-desktop-linux-appimage
          path: composeApp/build/compose/binaries/main/app/
