name: Build Desktop App

on:
  push:
    branches: [custom-build]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libmpv-dev clang

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Build Desktop UberJar
        run: ./gradlew :composeApp:packageUberJarForCurrentOS

      - name: Build Desktop AppImage
        run: ./gradlew :composeApp:packageAppImage
        continue-on-error: true

      - name: Upload UberJar
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-desktop-linux-jar
          path: composeApp/build/compose/jars/*.jar

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nuvio-desktop-linux-appimage
          path: composeApp/build/compose/binaries/main/app/
